type: feedback
enabled: true
description: "User guidance on how to approach work — corrections to avoid and approaches to keep. Record both failures and successes."
when_to_save: 'Any time the user corrects your approach ("no not that", "don''t", "stop doing X") OR confirms a non-obvious approach worked ("yes exactly", "perfect, keep doing that", accepting an unusual choice without pushback). Corrections are easy to notice; confirmations are quieter — watch for them. In both cases, save what is applicable to future conversations, especially if surprising or not obvious from the code. Include *why* so you can judge edge cases later.'
how_to_use: "Let these memories guide your behavior so that the user does not need to offer the same guidance twice."
body_structure: "Lead with the rule itself, then a **Why:** line (the reason the user gave — often a past incident or strong preference) and a **How to apply:** line (when/where this guidance kicks in). Knowing *why* lets you judge edge cases instead of blindly following the rule."
examples:
  - "user: don't mock the database in these tests — we got burned last quarter when mocked tests passed but the prod migration failed"
  - "assistant: [saves feedback memory: integration tests must hit a real database, not mocks. Reason: prior incident where mock/prod divergence masked a broken migration]"
  - "user: stop summarizing what you just did at the end of every response, I can read the diff"
  - "assistant: [saves feedback memory: this user wants terse responses with no trailing summaries]"
  - "user: yeah the single bundled PR was the right call here, splitting this one would've just been churn"
  - "assistant: [saves feedback memory: for refactors in this area, user prefers one bundled PR over many small ones. Confirmed after I chose this approach — a validated judgment call, not a correction]"
conditions:
  - name: behavioral_correction
    trigger: "User corrects your approach, output format, tone, or tool usage ('no, not that', 'don't do X', 'stop doing Y')"
    notes: "Always include the **Why:** — the reason or incident behind the correction"

  - name: validated_approach
    trigger: "User confirms an unusual or non-obvious choice was correct after seeing the result ('yes exactly', 'perfect, keep doing that', accepting an unusual choice without pushback)"
    notes: "This is 'success feedback' — prevents drift away from validated approaches"

  - name: explicit_remember
    trigger: "User explicitly asks you to remember a preference or rule ('remember that I prefer...', 'from now on always...')"
    notes: "Highest priority — user is explicitly requesting persistence"

exclusions:
  - "One-off fixes that won't recur in future conversations"
  - "Issues caused by transient environment state"
  - "User preferences already captured in an existing memory file — update that file instead"
  - "Routine confirmations without specific guidance"
  - "Routine acknowledgment without specifics ('ok', 'thanks', 'got it', 'sounds good')"
  - "Vague positive feedback without specifics ('good job', 'nice', 'works')"
